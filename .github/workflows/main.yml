name: Build JavaCPP FFmpeg Android ARM64

on:
  workflow_dispatch:
    inputs:
      javacpp_ref:
        description: "JavaCPP Presets tag/branch/commit"
        required: false
        default: "master"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout JavaCPP Presets
        uses: actions/checkout@v4
        with:
          repository: bytedeco/javacpp-presets
          ref: ${{ inputs.javacpp_ref }}
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm yasm gawk pkg-config autoconf automake libtool meson

          # Meson from apt can lag behind what cppbuild.sh expects;
          # override with the latest via pip.
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Android SDK & NDK
        run: |
          # Use pre-installed Android SDK on GitHub runners
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi

          # Accept all SDK licenses automatically
          yes | $SDKMANAGER --licenses || true

          # Install SDK components & NDK
          yes | $SDKMANAGER \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;27.2.12479018"

          # Export NDK environment variables for JavaCPP build
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          java -version
          mvn -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          test -d "$ANDROID_NDK"

      - name: Build FFmpeg JavaCPP preset
        run: |
          mvn install \
            --projects .,ffmpeg \
            -Djavacpp.platform=android-arm64 \
            -Djavacpp.platform.root="$ANDROID_NDK" \
            -DskipTests

      - name: Build FFmpeg JavaCPP preset and platform artifact
        run: |
          mvn install \
            --projects .,ffmpeg,ffmpeg/platform \
            -am \
            -Djavacpp.platform=android-arm64 \
            -Djavacpp.platform.root="$ANDROID_NDK" \
            -DskipTests

      - name: Collect artifacts
        run: |
          mkdir -p output

          find ffmpeg -type f \
            \( -name "*.jar" -o -name "*.so" \) \
            -exec cp {} output/ \; || true

          echo "===== BUILD OUTPUT ====="
          find output -type f -print

      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: javacpp-ffmpeg-android-arm64
          path: output/
          if-no-files-found: error
